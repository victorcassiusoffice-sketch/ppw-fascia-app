<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="%BASE_URL%assets/body_map.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <!-- Token value: dark-theme --c-bg-base (#15171C). Brand gold retired from
         app chrome per REBUILD-DIRECTION-2026-06-11 §2 (accent = orange). -->
    <meta name="theme-color" content="#15171C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PPW" />
    <link rel="apple-touch-icon" href="%BASE_URL%assets/icon-192.png" />
    <!-- 2026-06-15 — Google Fonts CDN dropped; Geist is now self-hosted
         (variable woff2) via @font-face in src/index.css. -->
    <title>PPW · Peak Performance Wellness</title>
    <!-- Dual-theme anti-flash: resolve + apply data-theme BEFORE first paint so
         the page never flashes the wrong palette. Mirrors src/theme.js. -->
    <script>
      (function () {
        try {
          var c = localStorage.getItem('ppw.theme');
          if (c !== 'light' && c !== 'dark' && c !== 'system') c = 'dark';
          var resolved = c === 'system'
            ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : c;
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body class="bg-bg text-ink font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          // %BASE_URL% is replaced at build time by Vite (e.g. '/ppw-fascia-app/')
          navigator.serviceWorker.register('%BASE_URL%sw.js').catch(function (err) {
            console.warn('SW registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
