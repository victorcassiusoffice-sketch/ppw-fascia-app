<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="%BASE_URL%assets/body_map.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <!-- Indigo's own `deep` (#0A1428), matching the default colourway (Vic,
         2026-10). A static meta tag cannot follow a user-selectable colourway,
         so this is one honest fixed value for the browser chrome around the app.
         The value it replaces was the retired dark-theme --c-bg-base, already
         wrong for the LIGHT gloft default it shipped under (and named only in
         git history, so a test can scan this file for it). Keep in step with
         public/manifest.json's background_color + theme_color. Brand gold stays
         retired from app chrome per REBUILD-DIRECTION-2026-06-11 §2. -->
    <meta name="theme-color" content="#0A1428" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PPWellness Lifestyle" />
    <link rel="apple-touch-icon" href="%BASE_URL%assets/icon-192.png" />
    <!-- 2026-06-15 — Google Fonts CDN dropped; Geist is now self-hosted
         (variable woff2) via @font-face in src/index.css. -->
    <title>PPWellness Lifestyle App</title>
    <!-- Dual-theme anti-flash: resolve + apply data-theme BEFORE first paint so
         the page never flashes the wrong palette. Mirrors src/theme.js. -->
    <script>
      (function () {
        try {
          var c = localStorage.getItem('ppw.theme');
          if (c !== 'light' && c !== 'dark' && c !== 'system') c = 'dark';
          var resolved = c === 'system'
            ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : c;
          document.documentElement.setAttribute('data-theme', resolved);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body class="bg-bg text-ink font-body antialiased">
    <div id="root"></div>
    <!-- Service-worker registration + auto-update flow moved into the app
         bundle (src/main.jsx -> src/lib/swUpdate.js) so it can detect new
         builds, prompt to refresh, and recover stuck caches. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
